<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="100%" height="100%">
  <defs>
    <!-- Sketchy displacement filter -->
    <filter id="sketchy-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="sketchy-line" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .bg { fill: #0b0f19; }
    .card-bg { fill: #111827; stroke-width: 2; }
    .card-human { stroke: #6366f1; }
    .card-agent { stroke: #a855f7; }
    .card-script { stroke: #06b6d4; }
    .card-diagram { stroke: #10b981; }
    
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .node-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    .node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #38bdf8; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; letter-spacing: 0.3px; }
    .center-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Container Box -->
  <rect x="6" y="6" width="988" height="508" rx="16" class="bg" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Circular Orbit Background -->
  <circle cx="500" cy="260" r="190" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
  
  <!-- Center Hub / Emblem -->
  <circle cx="500" cy="260" r="42" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#sketchy-filter)" />
  <text x="500" y="255" class="center-title" text-anchor="middle">Markdy</text>
  <text x="500" y="272" class="node-subtitle" font-size="10" fill="#64748b" text-anchor="middle">AI Loop</text>

  <!-- ==================== CURVED CIRCULAR ARROWS ==================== -->
  <!-- Top: 1 -> 2 -->
  <path d="M 360 110 Q 500 70 610 110" fill="none" stroke="#6366f1" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-purple)" />
  <rect x="420" y="55" width="160" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <text x="500" y="71" class="edge-label" fill="#818cf8" text-anchor="middle">1. Prompt system flow</text>

  <!-- Right: 2 -> 3 -->
  <path d="M 750 200 Q 790 260 750 320" fill="none" stroke="#a855f7" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-cyan)" />
  <rect x="765" y="248" width="140" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <text x="835" y="264" class="edge-label" fill="#c084fc" text-anchor="middle">2. Generate code</text>

  <!-- Bottom: 3 -> 4 -->
  <path d="M 610 410 Q 500 450 360 410" fill="none" stroke="#06b6d4" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-green)" />
  <rect x="420" y="440" width="160" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <text x="500" y="456" class="edge-label" fill="#38bdf8" text-anchor="middle">3. Render 60fps motion</text>

  <!-- Left: 4 -> 1 -->
  <path d="M 220 320 Q 180 260 220 200" fill="none" stroke="#10b981" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-blue)" />
  <rect x="75" y="248" width="140" height="24" rx="4" fill="#090d16" stroke="#1e293b" stroke-width="1" />
  <text x="145" y="264" class="edge-label" fill="#34d399" text-anchor="middle">4. Visual review</text>

  <!-- ==================== 1. TOP-LEFT: DEVELOPER PROMPT ==================== -->
  <g transform="translate(100, 45)">
    <rect x="0" y="0" width="245" height="130" rx="10" class="card-bg card-human" filter="url(#sketchy-filter)" />
    <circle cx="28" cy="28" r="15" fill="#1e1b4b" />
    <text x="28" y="34" font-size="16" text-anchor="middle">🧑‍💻</text>
    <text x="52" y="33" class="node-title">1. Developer Prompt</text>
    
    <rect x="12" y="54" width="221" height="64" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="74" class="node-code" fill="#f43f5e">"Follow @AGENT.md</text>
    <text x="22" y="92" class="node-code" fill="#f43f5e">&amp; generate cache-aside"</text>
    <text x="22" y="108" class="node-subtitle" font-size="10" fill="#94a3b8">Natural language prompt</text>
  </g>

  <!-- ==================== 2. TOP-RIGHT: AI CODING AGENT ==================== -->
  <g transform="translate(635, 45)">
    <rect x="0" y="0" width="245" height="130" rx="10" class="card-bg card-agent" filter="url(#sketchy-filter)" />
    <circle cx="28" cy="28" r="15" fill="#3b0764" />
    <text x="28" y="34" font-size="16" text-anchor="middle">🤖</text>
    <text x="52" y="33" class="node-title">2. AI Coding Agent</text>
    
    <rect x="12" y="54" width="221" height="64" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="76" class="node-subtitle" font-weight="600" fill="#cbd5e1">Cursor · Claude · Copilot</text>
    <text x="22" y="94" class="node-subtitle" font-size="11" fill="#a855f7">@markdy/mcp-server</text>
    <text x="22" y="108" class="node-subtitle" font-size="10" fill="#64748b">Self-healing syntax &amp; AST</text>
  </g>

  <!-- ==================== 3. BOTTOM-RIGHT: MARKDYSCRIPT ==================== -->
  <g transform="translate(635, 335)">
    <rect x="0" y="0" width="245" height="130" rx="10" class="card-bg card-script" filter="url(#sketchy-filter)" />
    <circle cx="28" cy="28" r="15" fill="#083344" />
    <text x="28" y="34" font-size="16" text-anchor="middle">📄</text>
    <text x="52" y="33" class="node-title">3. MarkdyScript</text>
    
    <rect x="12" y="54" width="221" height="64" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="74" class="node-code" fill="#f43f5e">scene <tspan fill="#e2e8f0">"Cache-Aside"</tspan></text>
    <text x="20" y="92" class="node-code" fill="#38bdf8">Client -&gt; Svc -&gt; Redis</text>
    <text x="20" y="108" class="node-subtitle" font-size="10" fill="#64748b">Clean, cycle-safe DSL AST</text>
  </g>

  <!-- ==================== 4. BOTTOM-LEFT: ANIMATED DIAGRAM ==================== -->
  <g transform="translate(100, 335)">
    <rect x="0" y="0" width="245" height="130" rx="10" class="card-bg card-diagram" filter="url(#sketchy-filter)" />
    <circle cx="28" cy="28" r="15" fill="#064e3b" />
    <text x="28" y="34" font-size="16" text-anchor="middle">🎬</text>
    <text x="52" y="33" class="node-title">4. Animated Diagram</text>
    
    <rect x="12" y="54" width="221" height="64" rx="6" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="22" y="76" class="node-subtitle" font-weight="600" fill="#34d399">⚡ 60fps WAAPI Motion</text>
    <text x="22" y="94" class="node-subtitle" font-size="11" fill="#f8fafc">IDE Preview (<tspan font-weight="600">Cmd+K V</tspan>)</text>
    <text x="22" y="108" class="node-subtitle" font-size="10" fill="#64748b">or Web Studio / Export</text>
  </g>
</svg>