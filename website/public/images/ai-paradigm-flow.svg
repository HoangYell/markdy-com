<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 700" width="100%" height="100%">
  <defs>
    <!-- Sketchy displacement filter for organic borders -->
    <filter id="sketchy-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="sketchy-line" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Arrow markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#6366f1" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#a855f7" />
    </marker>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#06b6d4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .bg { fill: #0b0f19; }
    .card-bg { fill: #111827; stroke-width: 2; }
    .card-human { stroke: #6366f1; }
    .card-agent { stroke: #a855f7; }
    .card-script { stroke: #06b6d4; }
    .card-diagram { stroke: #10b981; }
    
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .node-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    .node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #38bdf8; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11.5px; font-weight: 700; letter-spacing: 0.5px; }
    .center-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #38bdf8; letter-spacing: 1px; text-transform: uppercase; }
  </style>

  <!-- Container Box -->
  <rect x="6" y="6" width="868" height="688" rx="16" class="bg" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Square Loop Guide Lines -->
  <rect x="200" y="165" width="480" height="370" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  
  <!-- Center Square Badge -->
  <rect x="370" y="325" width="140" height="50" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#sketchy-filter)" />
  <text x="440" y="348" class="center-title" text-anchor="middle">Markdy Loop</text>
  <text x="440" y="364" class="node-subtitle" font-size="10" fill="#64748b" text-anchor="middle">AI Workflow</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- 1 -> 2 (Top: Left to Right) -->
  <g transform="translate(370, 165)">
    <path d="M 10 0 L 110 0" stroke="#6366f1" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-purple)" />
    <rect x="18" y="-14" width="84" height="26" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="60" y="3" class="edge-label" fill="#818cf8" text-anchor="middle">1. PROMPT</text>
  </g>

  <!-- 2 -> 3 (Right: Top to Bottom) -->
  <g transform="translate(640, 280)">
    <path d="M 0 10 L 0 95" stroke="#a855f7" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-cyan)" />
    <rect x="-48" y="40" width="96" height="26" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="57" class="edge-label" fill="#c084fc" text-anchor="middle">2. GENERATE</text>
  </g>

  <!-- 3 -> 4 (Bottom: Right to Left) -->
  <g transform="translate(370, 535)">
    <path d="M 120 0 L 20 0" stroke="#06b6d4" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-green)" />
    <rect x="28" y="-14" width="84" height="26" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="70" y="3" class="edge-label" fill="#38bdf8" text-anchor="middle">3. RENDER</text>
  </g>

  <!-- 4 -> 1 (Left: Bottom to Top) -->
  <g transform="translate(200, 280)">
    <path d="M 0 95 L 0 10" stroke="#10b981" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#arrow-blue)" />
    <rect x="-44" y="40" width="88" height="26" rx="6" fill="#090d16" stroke="#1e293b" stroke-width="1" />
    <text x="0" y="57" class="edge-label" fill="#34d399" text-anchor="middle">4. REVIEW</text>
  </g>

  <!-- ==================== 1. TOP-LEFT: DEVELOPER PROMPT ==================== -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="310" height="235" rx="12" class="card-bg card-human" filter="url(#sketchy-filter)" />
    <circle cx="30" cy="30" r="16" fill="#1e1b4b" />
    <text x="30" y="36" font-size="18" text-anchor="middle">🧑‍💻</text>
    <text x="56" y="35" class="node-title">1. Developer Prompt</text>
    
    <rect x="14" y="60" width="282" height="160" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="86" class="node-subtitle" font-weight="600" fill="#cbd5e1">Prompt in Natural Language:</text>
    <text x="26" y="112" class="node-code" fill="#f43f5e">"Read @AGENT.md</text>
    <text x="26" y="132" class="node-code" fill="#f43f5e">and generate an animated</text>
    <text x="26" y="152" class="node-code" fill="#f43f5e">cache-aside architecture flow</text>
    <text x="26" y="172" class="node-code" fill="#f43f5e">with Redis &amp; Postgres"</text>
    <text x="26" y="200" class="node-subtitle" font-size="10.5" fill="#818cf8">📖 Uses https://markdy.com/AGENT.md</text>
  </g>

  <!-- ==================== 2. TOP-RIGHT: AI CODING AGENT ==================== -->
  <g transform="translate(525, 45)">
    <rect x="0" y="0" width="310" height="235" rx="12" class="card-bg card-agent" filter="url(#sketchy-filter)" />
    <circle cx="30" cy="30" r="16" fill="#3b0764" />
    <text x="30" y="36" font-size="18" text-anchor="middle">🤖</text>
    <text x="56" y="35" class="node-title">2. AI Coding Agent</text>
    
    <rect x="14" y="60" width="282" height="160" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="86" class="node-subtitle" font-weight="600" fill="#cbd5e1">Understands Markdy Spec &amp; AST:</text>
    
    <g transform="translate(26, 102)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
      <text x="60" y="17" class="node-subtitle" font-weight="600" fill="#c7d2fe" text-anchor="middle">⚡ Cursor</text>
    </g>
    <g transform="translate(156, 102)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
      <text x="60" y="17" class="node-subtitle" font-weight="600" fill="#c7d2fe" text-anchor="middle">🧠 Claude</text>
    </g>
    <g transform="translate(26, 134)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
      <text x="60" y="17" class="node-subtitle" font-weight="600" fill="#c7d2fe" text-anchor="middle">🌐 Copilot</text>
    </g>
    <g transform="translate(156, 134)">
      <rect x="0" y="0" width="120" height="26" rx="5" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
      <text x="60" y="17" class="node-subtitle" font-weight="600" fill="#c7d2fe" text-anchor="middle">🚀 Antigravity</text>
    </g>
    <text x="26" y="184" class="node-subtitle" font-size="11" fill="#c084fc">MCP Server: @markdy/mcp-server</text>
    <text x="26" y="200" class="node-subtitle" font-size="10.5" fill="#94a3b8">Self-healing syntax diagnostics &amp; rules</text>
  </g>

  <!-- ==================== 3. BOTTOM-RIGHT: MARKDYSCRIPT ==================== -->
  <g transform="translate(525, 415)">
    <rect x="0" y="0" width="310" height="240" rx="12" class="card-bg card-script" filter="url(#sketchy-filter)" />
    <circle cx="30" cy="30" r="16" fill="#083344" />
    <text x="30" y="36" font-size="18" text-anchor="middle">📄</text>
    <text x="56" y="35" class="node-title">3. MarkdyScript</text>
    
    <rect x="14" y="60" width="282" height="165" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="84" class="node-code" fill="#f43f5e">scene <tspan fill="#e2e8f0">"Cache-Aside"</tspan> <tspan fill="#38bdf8">LR</tspan></text>
    <text x="26" y="104" class="node-code" fill="#38bdf8">browser <tspan fill="#f1f5f9">Client</tspan> · cache <tspan fill="#f1f5f9">Redis</tspan></text>
    <text x="26" y="124" class="node-code" fill="#38bdf8">service <tspan fill="#f1f5f9">Svc</tspan> · db <tspan fill="#f1f5f9">Postgres</tspan></text>
    <text x="26" y="148" class="node-code" fill="#a855f7">beat <tspan fill="#f1f5f9">cache_hit</tspan>:</text>
    <text x="36" y="168" class="node-code" fill="#38bdf8">Client -&gt; Svc -&gt; Redis</text>
    <text x="36" y="188" class="node-code" fill="#10b981">Client &lt;- Svc "200 Target URL"</text>
    <text x="26" y="210" class="node-subtitle" font-size="10.5" fill="#67e8f9">Strict, cycle-safe declarative DSL</text>
  </g>

  <!-- ==================== 4. BOTTOM-LEFT: ANIMATED DIAGRAM ==================== -->
  <g transform="translate(45, 415)">
    <rect x="0" y="0" width="310" height="240" rx="12" class="card-bg card-diagram" filter="url(#sketchy-filter)" />
    <circle cx="30" cy="30" r="16" fill="#064e3b" />
    <text x="30" y="36" font-size="18" text-anchor="middle">🎬</text>
    <text x="56" y="35" class="node-title">4. Live Animated Diagram</text>
    
    <rect x="14" y="60" width="282" height="165" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    <text x="26" y="86" class="node-subtitle" font-weight="600" fill="#34d399">⚡ 60fps WAAPI Engine</text>
    
    <rect x="26" y="100" width="258" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="155" y="122" class="node-subtitle" font-weight="600" fill="#f8fafc" text-anchor="middle">IDE Live Preview (<tspan fill="#38bdf8">Cmd+K V</tspan>)</text>

    <rect x="26" y="142" width="258" height="34" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="155" y="164" class="node-subtitle" font-weight="600" fill="#f8fafc" text-anchor="middle">Web Studio &amp; SVG / PNG Export</text>
    
    <text x="26" y="206" class="node-subtitle" font-size="10.5" fill="#6ee7b7">Zero-lag, browser-native motion graphics</text>
  </g>
</svg>