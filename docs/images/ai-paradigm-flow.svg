<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 320" width="100%" height="100%">
  <defs>
    <!-- Sketchy displacement filter for organic hand-drawn borders -->
    <filter id="sketchy-filter" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <filter id="sketchy-line" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" xChannelSelector="R" yChannelSelector="G" />
    </filter>

    <!-- Marker arrows -->
    <marker id="sketch-arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8" />
    </marker>
    <marker id="sketch-arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981" />
    </marker>
  </defs>

  <style>
    .bg { fill: #0b0f19; }
    .card-bg { fill: #111827; stroke-width: 2; }
    .card-human { stroke: #6366f1; }
    .card-agent { stroke: #a855f7; }
    .card-script { stroke: #06b6d4; }
    .card-diagram { stroke: #10b981; }
    
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #f8fafc; }
    .node-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #94a3b8; }
    .node-code { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; fill: #38bdf8; }
    .edge-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #cbd5e1; letter-spacing: 0.3px; }
    .pill-bg { fill: #1e293b; stroke: #334155; stroke-width: 1; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Canvas Container with Grid Pattern -->
  <rect x="6" y="6" width="1148" height="308" rx="14" class="bg" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Subtle Grid lines -->
  <g stroke="#1e293b" stroke-width="0.5" stroke-dasharray="3,3" opacity="0.5">
    <line x1="6" y1="80" x2="1154" y2="80" />
    <line x1="6" y1="160" x2="1154" y2="160" />
    <line x1="6" y1="240" x2="1154" y2="240" />
    <line x1="290" y1="6" x2="290" y2="314" />
    <line x1="580" y1="6" x2="580" y2="314" />
    <line x1="870" y1="6" x2="870" y2="314" />
  </g>

  <!-- ==================== 1. DEVELOPER PROMPT ==================== -->
  <g transform="translate(24, 28)">
    <rect x="0" y="0" width="240" height="264" rx="10" class="card-bg card-human" filter="url(#sketchy-filter)" />
    
    <circle cx="28" cy="30" r="16" fill="#1e1b4b" />
    <text x="28" y="36" font-size="18" text-anchor="middle">🧑‍💻</text>
    <text x="52" y="35" class="node-title">1. Developer Prompt</text>
    
    <rect x="12" y="62" width="216" height="188" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    
    <text x="22" y="88" class="node-subtitle" font-weight="600" fill="#cbd5e1">Prompt in Natural Language:</text>
    
    <text x="22" y="116" class="node-code" fill="#f43f5e">"Read @AGENT.md</text>
    <text x="22" y="136" class="node-code" fill="#f43f5e">and generate an animated</text>
    <text x="22" y="156" class="node-code" fill="#f43f5e">cache-aside flow</text>
    <text x="22" y="176" class="node-code" fill="#f43f5e">with Redis &amp; Postgres"</text>
    
    <rect x="20" y="202" width="200" height="34" rx="6" fill="#1e1b4b" stroke="#3730a3" stroke-width="1" />
    <text x="120" y="223" class="node-subtitle" font-size="11" fill="#c7d2fe" text-anchor="middle">📖 Uses https://markdy.com/AGENT.md</text>
  </g>

  <!-- ==================== CONNECTOR 1 -> 2 ==================== -->
  <g transform="translate(264, 160)">
    <path d="M 8 0 L 48 0" stroke="#6366f1" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#sketch-arrow)" />
    <text x="28" y="-12" class="edge-label" text-anchor="middle" fill="#818cf8">Prompts</text>
  </g>

  <!-- ==================== 2. AI CODING AGENT ==================== -->
  <g transform="translate(320, 28)">
    <rect x="0" y="0" width="240" height="264" rx="10" class="card-bg card-agent" filter="url(#sketchy-filter)" />
    
    <circle cx="28" cy="30" r="16" fill="#3b0764" />
    <text x="28" y="36" font-size="18" text-anchor="middle">🤖</text>
    <text x="52" y="35" class="node-title">2. AI Coding Agent</text>
    
    <rect x="12" y="62" width="216" height="188" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    
    <text x="22" y="88" class="node-subtitle" font-weight="600" fill="#cbd5e1">Understands Markdy AST:</text>
    
    <g transform="translate(20, 102)">
      <rect x="0" y="0" width="94" height="28" rx="6" class="pill-bg" />
      <text x="47" y="18" class="pill-text" text-anchor="middle">⚡ Cursor</text>
    </g>
    <g transform="translate(122, 102)">
      <rect x="0" y="0" width="94" height="28" rx="6" class="pill-bg" />
      <text x="47" y="18" class="pill-text" text-anchor="middle">🧠 Claude</text>
    </g>
    <g transform="translate(20, 138)">
      <rect x="0" y="0" width="94" height="28" rx="6" class="pill-bg" />
      <text x="47" y="18" class="pill-text" text-anchor="middle">🌐 Copilot</text>
    </g>
    <g transform="translate(122, 138)">
      <rect x="0" y="0" width="94" height="28" rx="6" class="pill-bg" />
      <text x="47" y="18" class="pill-text" text-anchor="middle">🚀 Antigravity</text>
    </g>

    <rect x="20" y="184" width="196" height="52" rx="6" fill="#2e1065" stroke="#581c87" stroke-width="1" />
    <text x="118" y="204" class="node-subtitle" font-size="11" fill="#d8b4fe" text-anchor="middle">MCP Server: @markdy/mcp-server</text>
    <text x="118" y="222" class="node-subtitle" font-size="10.5" fill="#a855f7" text-anchor="middle">Self-healing syntax &amp; rules</text>
  </g>

  <!-- ==================== CONNECTOR 2 -> 3 ==================== -->
  <g transform="translate(560, 160)">
    <path d="M 8 0 L 48 0" stroke="#a855f7" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#sketch-arrow)" />
    <text x="28" y="-12" class="edge-label" text-anchor="middle" fill="#c084fc">Generates</text>
  </g>

  <!-- ==================== 3. MARKDYSCRIPT ==================== -->
  <g transform="translate(616, 28)">
    <rect x="0" y="0" width="240" height="264" rx="10" class="card-bg card-script" filter="url(#sketchy-filter)" />
    
    <circle cx="28" cy="30" r="16" fill="#083344" />
    <text x="28" y="36" font-size="18" text-anchor="middle">📄</text>
    <text x="52" y="35" class="node-title">3. MarkdyScript</text>
    
    <rect x="12" y="62" width="216" height="188" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    
    <text x="20" y="86" class="node-code" fill="#f43f5e">scene <tspan fill="#e2e8f0">"Cache-Aside"</tspan> <tspan fill="#38bdf8">LR</tspan></text>
    <text x="20" y="104" class="node-code" fill="#38bdf8">browser <tspan fill="#f1f5f9">Client</tspan></text>
    <text x="20" y="122" class="node-code" fill="#38bdf8">service <tspan fill="#f1f5f9">Svc</tspan> · cache <tspan fill="#f1f5f9">Redis</tspan></text>
    <text x="20" y="146" class="node-code" fill="#a855f7">beat <tspan fill="#f1f5f9">cache_hit</tspan>:</text>
    <text x="30" y="166" class="node-code" fill="#38bdf8">Client -&gt; Svc -&gt; Redis</text>
    <text x="30" y="186" class="node-code" fill="#10b981">Client &lt;- Svc "200 Target"</text>
    
    <rect x="20" y="206" width="196" height="30" rx="6" fill="#083344" stroke="#0e7490" stroke-width="1" />
    <text x="118" y="225" class="node-subtitle" font-size="11" fill="#67e8f9" text-anchor="middle">Strict, cycle-safe grammar AST</text>
  </g>

  <!-- ==================== CONNECTOR 3 -> 4 ==================== -->
  <g transform="translate(856, 160)">
    <path d="M 8 0 L 48 0" stroke="#06b6d4" stroke-width="2.5" filter="url(#sketchy-line)" marker-end="url(#sketch-arrow-green)" />
    <text x="28" y="-12" class="edge-label" text-anchor="middle" fill="#38bdf8">Renders</text>
  </g>

  <!-- ==================== 4. ANIMATED DIAGRAM ==================== -->
  <g transform="translate(912, 28)">
    <rect x="0" y="0" width="224" height="264" rx="10" class="card-bg card-diagram" filter="url(#sketchy-filter)" />
    
    <circle cx="28" cy="30" r="16" fill="#064e3b" />
    <text x="28" y="36" font-size="18" text-anchor="middle">🎬</text>
    <text x="52" y="35" class="node-title">4. Animated Diagram</text>
    
    <rect x="12" y="62" width="200" height="188" rx="8" fill="#070a12" stroke="#1e293b" stroke-width="1" />
    
    <!-- Mini diagram preview -->
    <g transform="translate(18, 76)">
      <rect x="0" y="0" width="46" height="26" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="23" y="17" class="pill-text" font-size="9" text-anchor="middle" fill="#38bdf8">Client</text>
      
      <path d="M 48 13 L 74 13" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,2" />
      <circle cx="61" cy="13" r="3" fill="#38bdf8" />
      
      <rect x="76" y="0" width="44" height="26" rx="4" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <text x="98" y="17" class="pill-text" font-size="9" text-anchor="middle" fill="#10b981">Redis</text>
      
      <path d="M 122 13 L 148 13" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3,2" />
      <rect x="150" y="0" width="30" height="26" rx="4" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
      <text x="165" y="17" class="pill-text" font-size="9" text-anchor="middle" fill="#a855f7">DB</text>
    </g>

    <text x="20" y="130" class="node-subtitle" font-weight="600" fill="#38bdf8">⚡ 60fps Motion Engine</text>
    
    <rect x="20" y="146" width="180" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="110" y="165" class="pill-text" font-size="11" fill="#f8fafc" text-anchor="middle">IDE Preview (Cmd+K V)</text>

    <rect x="20" y="184" width="180" height="30" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="110" y="203" class="pill-text" font-size="11" fill="#f8fafc" text-anchor="middle">Web Studio / Export</text>
    
    <text x="110" y="234" class="node-subtitle" font-size="10" fill="#6ee7b7" text-anchor="middle">Zero-lag WAAPI animations</text>
  </g>
</svg>