name: Release

# Triggers when you push a version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # Create GitHub Releases & push tags
  packages: write   # Publish to GitHub Packages (npm.pkg.github.com)
  id-token: write   # npm provenance support

jobs:
  release:
    name: Publish to npm & GitHub Packages & Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for release notes

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Run test suite & compatibility gates
        run: |
          pnpm -r run test
          pnpm run gate
          pnpm run verify:examples

      - name: Publish packages → npmjs.com
        run: node scripts/publish-packages.mjs --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Configure GitHub Packages Authentication
        run: |
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> ~/.npmrc

      - name: Publish packages → GitHub Packages (npm.pkg.github.com)
        run: node scripts/publish-packages.mjs --registry=https://npm.pkg.github.com --scope=${{ github.repository_owner }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          body: |
            ## 🎬 Markdy ${{ github.ref_name }}

            **Open-source text-to-motion animation DSL engine.**

            ### 📦 Published Packages

            | Package | npmjs.com | GitHub Packages |
            |---|---|---|
            | [`@markdy/core`](https://www.npmjs.com/package/@markdy/core) | `pnpm add @markdy/core` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/renderer-dom`](https://www.npmjs.com/package/@markdy/renderer-dom) | `pnpm add @markdy/renderer-dom` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/cli`](https://www.npmjs.com/package/@markdy/cli) | `pnpm add -D @markdy/cli` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/astro`](https://www.npmjs.com/package/@markdy/astro) | `pnpm add @markdy/astro` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/stdlib-systems`](https://www.npmjs.com/package/@markdy/stdlib-systems) | `pnpm add @markdy/stdlib-systems` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/language-server`](https://www.npmjs.com/package/@markdy/language-server) | `pnpm add -D @markdy/language-server` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/mcp-server`](https://www.npmjs.com/package/@markdy/mcp-server) | `pnpm add -D @markdy/mcp-server` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |
            | [`@markdy/mdx`](https://www.npmjs.com/package/@markdy/mdx) | `pnpm add @markdy/mdx` | [GitHub Packages](https://github.com/HoangYell/markdy-com/packages) |

            ### 🚀 Quick Start
            ```sh
            pnpm add @markdy/core @markdy/renderer-dom
            ```

            ### 📖 Documentation & Guides
            - [Working with GitHub Packages](https://github.com/HoangYell/markdy-com/blob/main/docs/GITHUB_PACKAGES.md)
            - 👉 **[markdy.com](https://markdy.com)**
