name: Release

# Triggers when you push a version tag: git tag v0.1.0 && git push --tags
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # Create GitHub Releases & push tags
  packages: write   # Publish to GitHub Packages (npm.pkg.github.com)
  id-token: write   # npm provenance support

jobs:
  release:
    name: Publish to npm & GitHub Packages & Create Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for release notes

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm run build

      - name: Run test suite & compatibility gates
        run: |
          pnpm -r run test
          pnpm run gate
          pnpm run verify:examples

      - name: Publish packages → npmjs.com
        run: node scripts/publish-packages.mjs --registry=https://registry.npmjs.org
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish packages → GitHub Packages (npm.pkg.github.com)
        run: node scripts/publish-packages.mjs --registry=https://npm.pkg.github.com --scope=${{ github.repository_owner }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package VS Code Extension (.vsix)
        run: |
          cd packages/vscode
          pnpm run package

      - name: Publish VS Code Extension → Visual Studio Marketplace
        if: env.VSCE_PAT != ''
        run: |
          cd packages/vscode
          npx @vscode/vsce publish --no-dependencies -p ${{ secrets.VSCE_PAT }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Publish VS Code Extension → Open VSX Registry
        if: env.OVSX_PAT != ''
        continue-on-error: true
        run: |
          cd packages/vscode
          npx ovsx publish markdy-vscode-*.vsix -p ${{ secrets.OVSX_PAT }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          make_latest: true
          files: |
            packages/vscode/markdy-vscode-*.vsix
          body: |
            ## 🎬 Markdy ${{ github.ref_name }}

            **Open-source text-to-motion animation DSL engine.**

            ### 📦 Published Packages & Extensions

            | Package | Registry / Marketplace | Install Command |
            |---|---|---|
            | **VS Code Extension** | [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=hoangyell.markdy-vscode) | `code --install-extension hoangyell.markdy-vscode` |
            | **Cursor / VSCodium Extension** | [Open VSX Registry](https://open-vsx.org/extension/hoangyell/markdy-vscode) | `cursor --install-extension hoangyell.markdy-vscode` |
            | [`@markdy/core`](https://www.npmjs.com/package/@markdy/core) | [npmjs.com](https://www.npmjs.com/package/@markdy/core) | `pnpm add @markdy/core` |
            | [`@markdy/renderer-dom`](https://www.npmjs.com/package/@markdy/renderer-dom) | [npmjs.com](https://www.npmjs.com/package/@markdy/renderer-dom) | `pnpm add @markdy/renderer-dom` |
            | [`@markdy/cli`](https://www.npmjs.com/package/@markdy/cli) | [npmjs.com](https://www.npmjs.com/package/@markdy/cli) | `pnpm add -D @markdy/cli` |
            | [`@markdy/astro`](https://www.npmjs.com/package/@markdy/astro) | [npmjs.com](https://www.npmjs.com/package/@markdy/astro) | `pnpm add @markdy/astro` |
            | [`@markdy/stdlib-systems`](https://www.npmjs.com/package/@markdy/stdlib-systems) | [npmjs.com](https://www.npmjs.com/package/@markdy/stdlib-systems) | `pnpm add @markdy/stdlib-systems` |
            | [`@markdy/language-server`](https://www.npmjs.com/package/@markdy/language-server) | [npmjs.com](https://www.npmjs.com/package/@markdy/language-server) | `pnpm add -D @markdy/language-server` |
            | [`@markdy/mcp-server`](https://www.npmjs.com/package/@markdy/mcp-server) | [npmjs.com](https://www.npmjs.com/package/@markdy/mcp-server) | `pnpm add -D @markdy/mcp-server` |
            | [`@markdy/mdx`](https://www.npmjs.com/package/@markdy/mdx) | [npmjs.com](https://www.npmjs.com/package/@markdy/mdx) | `pnpm add @markdy/mdx` |

            ### 🚀 Quick Start
            ```sh
            pnpm add @markdy/core @markdy/renderer-dom
            ```

            ### 📖 Documentation & Guides
            - [VS Code & Cursor Extension Guide](https://marketplace.visualstudio.com/items?itemName=hoangyell.markdy-vscode)
            - [Working with GitHub Packages](https://github.com/HoangYell/markdy-com/blob/main/docs/GITHUB_PACKAGES.md)
            - 👉 **[markdy.com](https://markdy.com)**

