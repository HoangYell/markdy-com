name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  quality:
    name: Code Quality & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Type-check workspace
        run: pnpm run typecheck

      - name: Lint workspace
        run: pnpm run lint

  test:
    name: Test & Compatibility Gate (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Run unit & feature tests
        run: pnpm -r run test

      - name: Run compatibility gate
        run: pnpm run gate

      - name: Verify documentation and examples
        run: pnpm run verify:examples

  devtools-e2e:
    name: Chrome DevTools E2E & Visual Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Run Chrome DevTools headless layout & animation tests
        run: pnpm run test:devtools
        env:
          ARTIFACTS_DIR: ${{ github.workspace }}/tmp/devtools-artifacts

      - name: Upload Chrome DevTools artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chrome-devtools-screenshots
          path: tmp/devtools-artifacts/
          if-no-files-found: ignore
          retention-days: 7

  website:
    name: Website Build Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm run build:packages

      - name: Build Astro website
        run: pnpm run build:website
